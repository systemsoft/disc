# Minimal CI pipeline (P1-46).
#
# Runs lint + format check + the non-PG test suite on every push and PR.
# The PG-integration suite (DISC_PG_AUTO=1) is gated on a label to keep
# default CI fast — it downloads PostgreSQL binaries and takes several
# minutes. Re-enable by running the `ci-pg` workflow manually or add the
# `run-pg-tests` label to a PR.

name: CI

on:
  push:
    branches: [primary]
  pull_request:
    branches: [primary]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + format + tests (no PG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Documentation lives in the pinned disc.md submodule; the
          # docs-coverage pins in tests/gel-divergence-pins.test.ts read
          # from it, so an empty vendor/ fails the suite.
          submodules: true

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          # Pinned to an exact version, not the floating `v2.x`. A floating
          # range silently rolls forward and turns a Deno patch-level
          # behavior change into a CI-only failure that still passes locally
          # (e.g. 2.8.3 made post-`upgradeWebSocket` request access throw).
          # Bump deliberately after verifying the suite against the new
          # version locally. Keep all jobs in this file on the same version.
          deno-version: 2.8.3

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun's global install cache so `bun install` is a link-only
      # operation on warm runs.
      - name: Cache Bun install cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('ui/bun.lock') }}

      # Build the UI before the deno test step so `server/ui-assets.test.ts`
      # exercises the real embed-and-serve path. Without this, the four
      # tests in that file probe-skip when `ui/build/` is absent (the
      # Bundle I pattern). Caches keep the install + build under a minute
      # on warm runs.
      - name: Install UI dependencies
        run: cd ui && bun install --frozen-lockfile

      - name: Build UI
        run: cd ui && bun run build

      # dprint is the project formatter (`deno task format`); deno fmt is
      # intentionally unused. bunx fetches the dprint CLI; plugins come
      # from dprint.json.
      - name: Check formatting (dprint)
        run: bunx dprint check

      # Write the git-ignored embedded-PG manifest stub so the module
      # graph resolves. `deno task` chains this via prep, but the raw
      # `deno test`/`deno lint` invocations below bypass that chain.
      - name: Prep (write manifest stub)
        run: deno task prep

      - name: Lint
        run: deno lint

      # Enforce the strict compilerOptions in deno.json — tests run with
      # --no-check, so without this gate type errors only surface at
      # runtime. Covers every Deno module (ui/ has its own svelte-check).
      - name: Typecheck
        run: deno task typecheck

      - name: Tests (no PG) with coverage
        # P3-05: collect coverage on every push/PR so regressions in test
        # breadth are visible in CI logs. `deno coverage` prints a summary
        # to stdout; the raw data lives in ./coverage for any consumer
        # (e.g. codecov action can ingest the lcov output) to attach.
        run: |
          deno test --allow-all --no-check --coverage=coverage \
            schema/ compiler/ migration/ cli/ lib/ postgres/ \
            server/ protocol/ auth/ access/ extensions/ sdk/
          deno coverage coverage --lcov --output=coverage/lcov.info
          deno coverage coverage | tail -30

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  e2e-tests:
    name: UI E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Documentation lives in the pinned disc.md submodule; the
          # docs-coverage pins in tests/gel-divergence-pins.test.ts read
          # from it, so an empty vendor/ fails the suite.
          submodules: true

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: 2.8.3

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('ui/bun.lock') }}

      - name: Install UI dependencies
        run: cd ui && bun install --frozen-lockfile

      # Cache Playwright browser binaries (~92 MB chromium-headless-shell)
      # keyed on the bun.lock content so cache invalidates when the
      # @playwright/test version bumps.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/bun.lock') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd ui && bunx playwright install chromium --with-deps

      - name: Prep (write manifest stub)
        run: deno task prep

      # Cache the bundled PostgreSQL binary that `disc serve` downloads
      # on first run. Keyed on the version baked into postgres/downloader.ts.
      - name: Cache bundled PostgreSQL
        uses: actions/cache@v5.0.5
        with:
          path: ~/.disc/postgres
          key: ${{ runner.os }}-disc-pg-16.4

      - name: Run E2E tests
        run: cd ui && bun run test:e2e

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: ui/test-results/
          retention-days: 7

  pg-tests:
    name: PG integration tests
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-pg-tests')
    steps:
      - uses: actions/checkout@v6
        with:
          # Documentation lives in the pinned disc.md submodule; the
          # docs-coverage pins in tests/gel-divergence-pins.test.ts read
          # from it, so an empty vendor/ fails the suite.
          submodules: true

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: 2.8.3

      - name: Install PostgreSQL client binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql-client postgresql

      - name: Run PG integration tests
        env:
          DISC_PG_AUTO: "1"
        run: deno task test:pg

  gel-compat:
    name: Gel client compatibility (P2-09)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Documentation lives in the pinned disc.md submodule; the
          # docs-coverage pins in tests/gel-divergence-pins.test.ts read
          # from it, so an empty vendor/ fails the suite.
          submodules: true

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: 2.8.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/gel-compat/python/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/gel-compat/node/package.json

      - name: Cache bundled PostgreSQL
        uses: actions/cache@v5.0.5
        with:
          path: ~/.disc/postgres
          key: ${{ runner.os }}-disc-pg-16.4

      - name: Prep (write manifest stub)
        run: deno task prep

      - name: Run Gel client compatibility smoke
        run: bash tests/gel-compat/run.sh

      - name: Upload disc serve log on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gel-compat-disc-log
          path: tests/gel-compat/disc-serve.log
          retention-days: 7
