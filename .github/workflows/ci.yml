# Minimal CI pipeline (P1-46).
#
# Runs lint + format check + the non-PG test suite on every push and PR.
# The PG-integration suite (DISC_PG_AUTO=1) is gated on a label to keep
# default CI fast — it downloads PostgreSQL binaries and takes several
# minutes. Re-enable by running the `ci-pg` workflow manually or add the
# `run-pg-tests` label to a PR.

name: CI

on:
  push:
    branches: [primary]
  pull_request:
    branches: [primary]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + format + tests (no PG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # - name: Check formatting
      #   run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Tests (no PG) with coverage
        # P3-05: collect coverage on every push/PR so regressions in test
        # breadth are visible in CI logs. `deno coverage` prints a summary
        # to stdout; the raw data lives in ./coverage for any consumer
        # (e.g. codecov action can ingest the lcov output) to attach.
        run: |
          deno test --allow-all --no-check --coverage=coverage \
            schema/ compiler/ migration/ cli/ lib/ postgres/ \
            server/ protocol/ auth/ access/ extensions/ sdk/
          deno coverage coverage --lcov --output=coverage/lcov.info
          deno coverage coverage | tail -30

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  e2e-tests:
    name: UI E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        run: cd ui && bun install --frozen-lockfile

      # Cache Playwright browser binaries (~92 MB chromium-headless-shell)
      # keyed on the bun.lock content so cache invalidates when the
      # @playwright/test version bumps.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/bun.lock') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd ui && bunx playwright install chromium --with-deps

      # Cache the bundled PostgreSQL binary that `disc serve` downloads
      # on first run. Keyed on the version baked into postgres/downloader.ts.
      - name: Cache bundled PostgreSQL
        uses: actions/cache@v4
        with:
          path: ~/.disc/postgres
          key: ${{ runner.os }}-disc-pg-16.4

      - name: Run E2E tests
        run: cd ui && bun run test:e2e

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: ui/test-results/
          retention-days: 7

  pg-tests:
    name: PG integration tests
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-pg-tests')
    steps:
      - uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install PostgreSQL client binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql-client postgresql

      - name: Run PG integration tests
        env:
          DISC_PG_AUTO: "1"
        run: deno task test:pg

  gel-compat:
    name: Gel client compatibility (P2-09)
    runs-on: ubuntu-latest
    # Soft-fail while compat gaps are being closed (see
    # tests/gel-compat/README.md → "Known compat gaps"). The workflow log
    # surfaces which clients/queries pass; PRs are not blocked.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/gel-compat/python/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/gel-compat/node/package.json

      - name: Cache bundled PostgreSQL
        uses: actions/cache@v4
        with:
          path: ~/.disc/postgres
          key: ${{ runner.os }}-disc-pg-16.4

      - name: Run Gel client compatibility smoke
        run: bash tests/gel-compat/run.sh

      - name: Upload disc serve log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gel-compat-disc-log
          path: tests/gel-compat/disc-serve.log
          retention-days: 7
