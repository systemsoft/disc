# Release automation (P3-06).
#
# Triggered on tag push (v*) — builds native binaries for the supported
# platforms, computes SHA-256 checksums, and attaches everything to a
# GitHub release. The version is read from version.txt (ChronVer); the
# git tag is the source of truth for "what should this release be named".
#
# To cut a release:
#   1. `just version` (bumps version.txt to today's date)
#   2. `git commit -am "Release $(cat version.txt)"`
#   3. `git tag v$(cat version.txt)`
#   4. `git push --tags`

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2026.04.17)"
        required: true

permissions:
  contents: write
  packages: write # ghcr.io push (gh/geldata#5699 + #4901)

jobs:
  # The UI bundle is platform-independent static output — build it once
  # and share it with every platform job instead of rebuilding 3x.
  build-ui:
    name: Build UI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('ui/bun.lock') }}

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        run: bun run build

      - name: Upload UI bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-build
          path: ui/build

  build:
    name: Build ${{ matrix.platform }}
    needs: build-ui
    strategy:
      # `darwin-x64` removed from the release matrix because the
      # macos-13 runner job hangs indefinitely on the GitHub-hosted
      # runner and never publishes its artifact. Platform support
      # itself stays — `cli/build.ts` and `postgres/downloader.ts` can
      # still produce a darwin-x64 binary when invoked directly
      # (`deno task build:darwin-x64`); we just don't ship one as a
      # pre-built release artifact. Apple Silicon Macs run the arm64
      # binary natively; older Intel Macs can build from source or use
      # Rosetta on the arm64 binary.
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            artifact: disc-linux-x64
          - platform: linux-arm64
            runner: ubuntu-latest
            artifact: disc-linux-arm64
          - platform: darwin-arm64
            runner: macos-14
            artifact: disc-darwin-arm64
          # Cross-compiled on ubuntu-latest (not windows-latest): `deno
          # compile --target x86_64-pc-windows-msvc` produces the .exe,
          # and the PG-staging JAR→txz extract chain needs unzip + tar
          # with xz support, which the Linux runner has but a Windows
          # runner does not. deno writes `disc-windows-x64.exe`, so the
          # artifact name carries the extension through checksum + upload.
          - platform: windows-x64
            runner: ubuntu-latest
            artifact: disc-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          # Pinned, not floating `v2.x` — see ci.yml for rationale. Keep in
          # sync with ci.yml so releases build on the version CI tested.
          deno-version: 2.8.3

      - name: Download UI bundle (needed for bundled binary)
        uses: actions/download-artifact@v8.0.1
        with:
          name: ui-build
          path: ui/build

      - name: Prep (write manifest stub)
        run: deno task prep

      - name: Build binary
        run: |
          deno run --allow-all --no-check cli/main.ts build \
            --platform ${{ matrix.platform }} \
            --output ${{ matrix.artifact }}

      - name: Checksum
        run: shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          # Pinned, not floating `v2.x` — see ci.yml for rationale. Keep in
          # sync with the build jobs so the man pages generate on the version
          # CI tested.
          deno-version: 2.8.3

      - name: Install pandoc (man-page generation)
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # Man pages aren't a build artifact — `deno task man` renders them from
      # docs/ via pandoc here, then packages them as `disc-man.tar.gz` so the
      # publish step ships them alongside the binaries. `install.sh` fetches
      # this archive from the release assets; without it, every install hits
      # the "man-page archive unavailable" skip path.
      - name: Generate and package man pages
        run: |
          deno task man
          mkdir -p release
          tar -czf release/disc-man.tar.gz -C build/man .

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release

      - name: Consolidate checksums
        run: |
          find release -name '*.sha256' -exec cat {} \; > release/CHECKSUMS.txt
          cat release/CHECKSUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release/**/disc-*
            release/disc-man.tar.gz
            release/CHECKSUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false

  # Docker image push to ghcr.io. (gh/geldata#5699 + #4901)
  #
  # Two tags fire in lockstep on every release:
  #   - ghcr.io/systemsoft/disc:<version>  (immutable, points at the
  #     image built from this exact commit)
  #   - ghcr.io/systemsoft/disc:latest     (mutable, always tracks the
  #     most recent release; never lags behind the version tag because
  #     both tags push from the same job)
  #
  # The job triggers on the same `tags: v*` event as the binary build
  # so a tag push produces both binaries (publish job above) and
  # container images in the same release window. ghcr.io is the canonical
  # registry — no Docker Hub mirror — to keep operator-facing pull URLs
  # stable and avoid the upstream `:latest` drift documented in #4901.
  docker:
    name: Push Docker image (ghcr.io)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version tag
        id: version
        run: |
          # Strip the leading `v` from the git tag so the docker tag is
          # `:2026.05.07` not `:v2026.05.07`. The leading `v` stays on
          # the GitHub release name and the binary checksum file —
          # docker convention is unprefixed semver/chronver.
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          # Pinned, not floating `v2.x` — see ci.yml for rationale. Keep in
          # sync with ci.yml so releases build on the version CI tested.
          deno-version: 2.8.3

      - name: Prep (write manifest stub)
        run: deno task prep

      # Build once, tag twice. `:latest` and the version tag come from
      # the same image build so they're always in sync — closing the
      # mismatch documented in #4901.
      - name: Build and push image (version + latest)
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: ./Dockerfile.bundled
          push: true
          tags: |
            ghcr.io/systemsoft/disc:${{ steps.version.outputs.version }}
            ghcr.io/systemsoft/disc:latest
          # linux/amd64 + linux/arm64 covers the two pre-built binary
          # platforms; matches what the `publish` job produces.
          platforms: linux/amd64,linux/arm64
