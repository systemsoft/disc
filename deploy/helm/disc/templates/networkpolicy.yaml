{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "disc.fullname" . }}
  labels:
    {{- include "disc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "disc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if or .Values.networkPolicy.ingressFromNamespaces .Values.networkPolicy.ingressFromPods }}
    - from:
        {{- range .Values.networkPolicy.ingressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- range .Values.networkPolicy.ingressFromPods }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5656
    {{- else }}
    # No source allowlist supplied — only allow same-namespace traffic by default.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5656
    {{- end }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL — opened wide because the external host varies. Tighten in your overlay.
    - {}
{{- end }}
