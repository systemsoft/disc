{{- /*
Chart-managed Secret. Only created when secrets.create=true AND at least one
of the following is true:
  - .Values.database.external.url is provided as a literal
  - .Values.auth.jwtSecret is provided as a literal, OR auth is enabled with no external jwtSecretRef
*/ -}}
{{- $createDbUrl := and .Values.secrets.create .Values.database.external.url (not .Values.database.external.urlSecretRef.name) -}}
{{- $createJwt := and .Values.secrets.create .Values.auth.enabled (not .Values.auth.jwtSecretRef.name) -}}
{{- if or $createDbUrl $createJwt -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "disc.secretName" . }}
  labels:
    {{- include "disc.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if $createDbUrl }}
  DATABASE_URL: {{ .Values.database.external.url | b64enc | quote }}
  {{- end }}
  {{- if $createJwt }}
  DISC_JWT_SECRET: {{ include "disc.resolvedJwtSecret" . | b64enc | quote }}
  {{- end }}
{{- end }}
