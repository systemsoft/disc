apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "disc.fullname" . }}-test-connection"
  labels:
    {{- include "disc.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
        - "--spider"
        - "--tries=1"
        - "--timeout=10"
        - "http://{{ include "disc.fullname" . }}:{{ .Values.service.port }}/health/ready"
