# =============================================================================
# Disc Helm chart — production overlay example
# =============================================================================
# Copy this file, edit the values, and pass it with:
#   helm upgrade --install disc ./deploy/helm/disc -f my-prod-values.yaml
# =============================================================================

image:
  # Pin to an exact, reproducible tag in production.
  tag: "2026.05.04"
  pullPolicy: IfNotPresent

# Three replicas across zones for HA.
replicaCount: 3

# Spread across zones if your cluster has the topology label.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: disc

# Beefier resources for production traffic.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# Database: pull DATABASE_URL from a Secret you created out-of-band.
# Recommended over inline literal for production.
database:
  external:
    urlSecretRef:
      name: disc-postgres-credentials
      key: DATABASE_URL

# Auth: same — pull JWT secret from an externally managed Secret.
auth:
  enabled: true
  enableAccessPolicies: true
  jwtSecretRef:
    name: disc-jwt
    key: secret

# In-pod TLS termination using a cert-manager-issued cert.
# Alternative: leave this disabled and terminate at the Ingress.
tls:
  enabled: true
  certSecret: disc-tls

# Public-facing Ingress with cert-manager + nginx.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: disc.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: disc-public-tls
      hosts:
        - disc.example.com

# Autoscaling on CPU.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70

# Wire up Prometheus Operator scraping.
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: kube-prometheus-stack

# Lock down ingress to only the namespaces that actually call Disc.
networkPolicy:
  enabled: true
  ingressFromNamespaces:
    - frontend
    - monitoring

# Sensible production runtime tuning.
runtime:
  logLevel: INFO
  logFormat: json
  requestTimeoutMs: 30000
  maxConnections: 200
  cacheMaxSize: 5000
  slowQueryMs: 500
  rateLimitRpm: 6000
  rateLimitBurst: 200

cors:
  enabled: true
  allowedOrigins: "https://app.example.com,https://admin.example.com"

# Don't let Helm create Secrets in production — manage them out-of-band.
secrets:
  create: false

# PDB tuned to require 2 replicas always available.
pdb:
  enabled: true
  minAvailable: 2
