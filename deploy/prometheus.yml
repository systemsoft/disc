# =============================================================================
# Prometheus scrape configuration for Disc
# =============================================================================
# Used by the monitoring compose overlay.
# Disc exposes Prometheus-format metrics at /metrics when DISC_ENABLE_METRICS
# is set to "true".
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "disc"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["disc:5656"]
        labels:
          service: "disc-database"
